<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}BPA Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% from "_logo.html" import panw_logo %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      {{ panw_logo(size='topbar') }}
      <span class="brand-sep"></span>
      <span class="brand-product">BPA Portal</span>
    </a>
    <nav>
      <a href="{{ url_for('index') }}">Run / History</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
